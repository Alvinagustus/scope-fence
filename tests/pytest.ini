[pytest]
# Kept in tests/ (not the repository root): the repository root is itself the
# plugin, with an __init__.py entry point. If pytest's rootdir landed there it
# would try to parse that directory as a package (and the folder name contains
# a hyphen, which is not a legal package name). Running with tests/ as rootdir
# avoids that: `python -m pytest tests/` from the repository root also works.
addopts = -q
